name: "Run Test Backend"
run-name: "Test Backend API"

on:
    push:
        branches: 
            - main
    pull_request:
        branches:
            - main

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v5
            
            - name: SetUp Python env
              uses: actions/setup-python@v6

            - name: Install uv
              uses: astral-sh/setup-uv@v7

            - name: Install libs for project
              run: uv sync

            - name: Run test
              run: |
                cat .env.example >  .env
                uv run pytest -vv